services:
  mongodb:
    image: mongo:8.0
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD-SHELL", "mongosh --eval \"db.adminCommand({ ping: 1 })\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  mongodb-replica-init:
    image: mongo:8.0
    depends_on:
      mongodb:
        condition: service_healthy
    restart: "no"
    command:
      - bash
      - -c
      - >-
        mongosh --host mongodb --quiet --eval
        'try { rs.status(); } catch (error) { rs.initiate({ _id: "rs0", members: [{ _id: 0, host: "localhost:27017" }] }); }'
